name: Build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}

          # Pull the section for this version from CHANGELOG.md, falling back to [Unreleased].
          extract_section() {
            awk -v header="$1" '
              index($0, header) == 1 {flag=1; next}
              flag && /^## / {exit}
              flag {print}
            ' CHANGELOG.md
          }

          NOTES=$(extract_section "## [${VERSION}]")
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES=$(extract_section "## [Unreleased]")
          fi

          {
            printf '%s\n' "$NOTES"
            echo ""
            echo "## Installation"
            echo ""
            echo "### Driver Binary"
            echo "Download \`maschine-mikro-mk3-driver\` (Linux x86_64) below."
            echo ""
            echo "### GUI Binary"
            echo "Download \`maschine-mikro-mk3-gui\` (Linux x86_64) below for the desktop configuration UI."
            echo ""
            echo "### Bitwig Controller Script"
            echo "Download \`MaschineMikroMK3.control.js\` and place it in:"
            echo "\`~/.BitwigStudio/Controller Scripts/Native Instruments/\`"
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: bitwig/package-lock.json

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libasound2-dev libjack-dev

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build Rust workspace
        run: cargo build --workspace --release --verbose

      - name: Run Rust tests
        run: cargo test --workspace --verbose

      - name: Build Bitwig controller script
        working-directory: bitwig
        run: |
          npm ci
          npm run build

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp target/release/driver artifacts/maschine-mikro-mk3-driver
          cp target/release/gui artifacts/maschine-mikro-mk3-gui
          chmod +x artifacts/maschine-mikro-mk3-driver artifacts/maschine-mikro-mk3-gui
          cp bitwig/dist/MaschineMikroMK3.control.js artifacts/

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: maschine-mikro-mk3-driver-linux-x86_64
          path: artifacts/maschine-mikro-mk3-driver
          if-no-files-found: error

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: maschine-mikro-mk3-gui-linux-x86_64
          path: artifacts/maschine-mikro-mk3-gui
          if-no-files-found: error

      - name: Upload Bitwig script artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitwig-controller-script
          path: artifacts/MaschineMikroMK3.control.js
          if-no-files-found: error

      - name: Create release and upload artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/maschine-mikro-mk3-driver
            artifacts/maschine-mikro-mk3-gui
            artifacts/MaschineMikroMK3.control.js
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
