# default_config.toml
#
# Source of truth for default settings. Every key in this file is at its
# default value and is commented out. Uncomment any line to make it explicit.
#
# Generated by `cargo run --bin gen-default-config`. Do not hand-edit — edits
# are lost on regeneration. Configure the driver by editing your XDG config at
# `~/.config/maschine-mikro-mk3-driver/config.toml` (created automatically on
# first run) or by passing `-c <path>` on the CLI.
#
# Pads keyed 1..16, matching the physical pad numbers labelled on the device:
# 1 = bottom-left, 16 = top-right.
# Buttons keyed by snake_case names from the `Buttons` enum:
#   maschine, star, browse, volume, swing, tempo, plugin, sampling,
#   left, right, pitch, mod, perform, notes, group, auto,
#   lock, note_repeat, restart, erase, tap, follow, play, rec,
#   stop, shift, fixed_vol, pad_mode, keyboard, chords, step, scene,
#   pattern, events, variation, duplicate, select, solo, mute,
#   encoder_press, encoder_touch.

[global]
# client_name = "Maschine Mikro MK3"
# port_name = "Maschine Mikro MK3 MIDI Out"
# port_name_in = "Maschine Mikro MK3 MIDI In"

[hardware]
# pad_sensitivity = 50
# display_contrast = 50
# pad_velocity_curve = "linear"
# led_brightness = 5

[bridge]
# midi_bridge_virmidi = false
# autoconnect_virmidi = true
# virmidi_client_name = ""
# virmidi_port = 0

[driver]
# soft_off_enabled = true
# self_test_on_launch = true

[pad_paging]
